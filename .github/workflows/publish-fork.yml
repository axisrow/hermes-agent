name: Publish fork to PyPI

# Fork-owned publish pipeline for `hermes-agent-axisrow`.
#
# Deliberately separate from upstream's `upload_to_pypi.yml` so that pulling
# from NousResearch never conflicts here — a new file has nothing to merge.
# Upstream's workflow is left on `workflow_dispatch:` only so it never fires.
#
# Differences from upstream's pipeline, all intentional:
#   * No Node/npm steps — the web dashboard and TUI bundles are not built,
#     so `hermes dashboard` and the TUI are non-functional in this wheel.
#     This fork is consumed as a library, not as a GUI.
#   * Tag trigger is `v*` (not `v20*`), so plain SemVer tags publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      confirm_tag:
        description: 'Tag to publish (e.g. v0.16.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-fork
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.confirm_tag || github.ref }}
          fetch-tags: true

      - name: Validate tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! git tag -l "${{ inputs.confirm_tag }}" | grep -q .; then
            echo "::error::Tag '${{ inputs.confirm_tag }}' does not exist in the repo"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Set package version from tag
        # pyproject.toml's `version` is upstream's own and gets clobbered on
        # every resync (main is recreated from upstream, not merged) — it is
        # never a reliable release number for this fork. The git tag is the
        # only value that survives a resync, so it is the single source of
        # truth: PyPI version = tag name with the leading "v" stripped.
        run: |
          TAG="${{ inputs.confirm_tag || github.ref_name }}"
          VERSION="${TAG#v}"
          python3 -c "
          import re, sys
          version = '$VERSION'
          # PEP 440 release-segment check (X.Y.Z or X.Y.Z.N); reject anything
          # with a stray v/local-version marker so a malformed tag fails the
          # build instead of silently publishing garbage.
          if not re.fullmatch(r'[0-9]+(\.[0-9]+)*', version):
              sys.exit(f'tag {\"$TAG\"!r} does not yield a valid PEP 440 version: {version!r}')
          "
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          echo "package version -> $VERSION"

      - name: Guard against upstream self-references
        # A leftover `hermes-agent[extra]` in optional-dependencies would make
        # `pip install hermes-agent-axisrow[all]` pull NousResearch's package
        # in alongside this one — both write agent/, tools/, utils.py to the
        # same paths and clobber each other. Fail the build instead.
        run: |
          python3 -c "
          import tomllib
          d = tomllib.load(open('pyproject.toml','rb'))['project']
          assert d['name'] == 'hermes-agent-axisrow', d['name']
          bad = [x for v in d['optional-dependencies'].values() for x in v
                 if x.startswith('hermes-agent[')]
          assert not bad, f'stale self-references: {bad}'
          print('metadata OK:', d['name'])
          "

      - name: Build wheel and sdist
        run: uv build --sdist --wheel

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-agent-axisrow
    permissions:
      id-token: write  # OIDC trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          skip-existing: true
